name: Daily End-of-Day Price Refresh

on:
  schedule:
    # 07:00 UTC Mon-Fri (~8:00 PM NZDT / 7:00 PM NZST, after NZX & ASX close)
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch End-of-Day NZX & ASX Prices
        run: |
          python -m pipeline.fetch_prices --data-dir public/data --output public/data/prices.json

      - name: Create Pull Request for Updated Prices
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: public/data/prices.json
          branch: chore/daily-eod-prices
          delete-branch: true
          commit-message: "data: refresh end-of-day NZX/ASX prices"
          title: "data: refresh end-of-day NZX & ASX prices"
          body: |
            Automated end-of-day price refresh from `prices.yml` (Yahoo Finance).

            Updates `public/data/prices.json` for hosted GitHub Pages users.
          reviewers: susanjanenz
          assignees: susanjanenz
