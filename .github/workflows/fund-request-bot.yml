name: Process Crowdsourced Fund Requests

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process-request:
    if: contains(github.event.issue.labels.*.name, 'new-fund') || startsWith(github.event.issue.title, '[Fund Request]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Process Fund Request
        id: process_fund
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python pipeline/automation/process_fund_request.py

      - name: Create Pull Request for Updated Catalog
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: pipeline/fund_catalog.json
          branch: chore/fund-request-${{ github.event.issue.number }}
          delete-branch: true
          commit-message: "chore(catalog): add fund from issue #${{ github.event.issue.number }}"
          title: "chore(catalog): add fund from issue #${{ github.event.issue.number }}"
          body: |
            Automated catalog update from fund request issue #${{ github.event.issue.number }}.

            Closes #${{ github.event.issue.number }}
          reviewers: susanjanenz
          assignees: susanjanenz

      - name: Comment on Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.create_pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            gh issue comment "$ISSUE_NUM" --body "🎉 **Fund Request Validated!**

            A pull request has been opened to add this fund to \`pipeline/fund_catalog.json\`: $PR_URL

            Once approved and merged by a maintainer, this issue will close automatically and the fund will be included in the next ingestion run."
          else
            gh issue comment "$ISSUE_NUM" --body "ℹ️ This fund is already present in \`pipeline/fund_catalog.json\`. Closing issue."
            gh issue close "$ISSUE_NUM" --reason "completed"
          fi
