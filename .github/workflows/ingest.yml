name: Upstream Ingestion & Data Compilation

on:
  schedule:
    - cron: '0 6 1 * *' # 6:00 UTC on the 1st of each month
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pipeline/requirements.txt ]; then pip install -r pipeline/requirements.txt; fi
          if [ -f pipeline/requirements-dev.txt ]; then pip install -r pipeline/requirements-dev.txt; fi

      - name: Run Lint & Test Suite
        run: |
          pip install ruff
          ruff check --select F821,F823 pipeline/
          python -m unittest discover -s pipeline/tests -v

      - name: Run Ingestion Pipeline
        run: |
          python -m pipeline.ingest --fetch --staging-dir data/staging --output-dir public/data

      - name: Create Pull Request for Updated Datasets
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            public/data/
            pipeline/security_master/security_master.json
          branch: chore/monthly-data-ingest
          delete-branch: true
          commit-message: "data: compile static portfolio look-through assets"
          title: "data: update compiled portfolio look-through datasets"
          body: |
            Automated data ingestion run from `ingest.yml`.

            Updates `public/data/` and `pipeline/security_master/security_master.json`.
          reviewers: susanjanenz
          assignees: susanjanenz

