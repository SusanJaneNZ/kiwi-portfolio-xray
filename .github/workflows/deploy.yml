name: Deploy Kiwi Portfolio X-Ray to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Upstream Pipeline Lint, Tests & Asset Verification
        run: |
          pip install ruff
          ruff check --select F821,F823 pipeline/
          python -m unittest discover -s pipeline/tests -v
          python -m pipeline.ingest --staging-dir data/staging --output-dir public/data

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Run Frontend Tests
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Setup Pages
        if: github.event.repository.private == false
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        if: github.event.repository.private == false
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event.repository.private == false
        uses: actions/deploy-pages@v4

